apiVersion: v1
kind: Service
metadata:
  name: ente-museum
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: ente-museum
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ente-museum
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ente-museum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ente-museum
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - /bin/sh
            - -ec
            - until pg_isready -h ente-postgres.apps.svc.cluster.local -p 5432 -U pguser -d ente_db; do sleep 2; done
      containers:
        - name: museum
          image: ghcr.io/ente/server:latest
          env:
            - name: ENTE_CREDENTIALS_FILE
              value: /museum.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: credentials
              mountPath: /museum.yaml
              subPath: museum.yaml
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: ente-credentials
            items:
              - key: museum.yaml
                path: museum.yaml
