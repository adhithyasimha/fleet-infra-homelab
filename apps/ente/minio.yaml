apiVersion: v1
kind: Service
metadata:
  name: ente-minio
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: ente-minio
  ports:
    - name: s3
      port: 3200
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ente-minio
  namespace: apps
spec:
  serviceName: ente-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ente-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ente-minio
    spec:
      containers:
        - name: minio
          image: pgsty/silo
          command:
            - server
            - /data
            - --address
            - ":3200"
            - --console-address
            - ":3201"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ente-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ente-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: s3
              containerPort: 3200
            - name: console
              containerPort: 3201
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until mc alias set ente http://127.0.0.1:3200 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                      sleep 2
                    done
                    mc mb --ignore-existing ente/b2-eu-cen
                    mc mb --ignore-existing ente/wasabi-eu-central-2-v3
                    mc mb --ignore-existing ente/scw-eu-fr-v3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
