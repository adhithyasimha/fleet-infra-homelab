apiVersion: v1
kind: Service
metadata:
  name: ente-web
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: ente-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ente-web
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ente-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ente-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ente/web:latest
          env:
            - name: ENTE_API_ORIGIN
              value: https://photos.ember-willow-maple-lumen.invalid
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
