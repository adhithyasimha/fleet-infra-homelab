apiVersion: v1
kind: Service
metadata:
  name: ente-postgres
  namespace: apps
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ente-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ente-postgres
  namespace: apps
spec:
  serviceName: ente-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ente-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ente-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: pguser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ente-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: ente_db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -q
                - -d
                - ente_db
                - -U
                - pguser
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
