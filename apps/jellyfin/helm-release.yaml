apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: apps
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  values:
    service:
      type: ClusterIP
      port: 8096

    ingress:
      enabled: false

    persistence:
      config:
        enabled: true
        size: 10Gi
      media:
        enabled: true
        size: 200Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
