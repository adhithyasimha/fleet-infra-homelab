apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: apps
spec:
  interval: 1h
  chart:
    spec:
      chart: n8n
      version: "1.24.x"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    # Database configuration
    db:
      type: postgresdb
    
    externalPostgresql:
      host: postgres-postgresql.databases.svc.cluster.local
      port: 5432
      username: n8n
      existingSecret: postgres-credentials
      existingSecretPasswordKey: password
      database: n8n
    
    # Redis configuration for webhook queue mode
    externalRedis:
      host: redis-master.databases.svc.cluster.local
      port: 6379

    # Service configuration
    service:
      name: http
      port: 5678
      type: ClusterIP
    
    # Ingress is managed via standalone ingress.yaml
    ingress:
      enabled: false
    
    # Main node configuration
    main:
      count: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 512m
          memory: 512Mi
      extraEnvVars:
        N8N_LISTEN_ADDRESS: "0.0.0.0"
        EXECUTIONS_MODE: queue
        QUEUE_BULL_REDIS_HOST: redis-master.databases.svc.cluster.local
        QUEUE_BULL_REDIS_PORT: "6379"
    
    # Webhooks
    webhook:
      mode: queue
      count: 2
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 512m
          memory: 512Mi
