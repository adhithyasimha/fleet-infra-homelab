# Sealed Secrets for n8n PostgreSQL credentials
#
# 1. Generate the sealing key (run on your cluster):
# kubectl get secret -n kube-system sealed-secrets-key -o yaml > sealing-key.yaml
#
# 2. Create a regular secret locally:
# kubectl create secret generic postgres-credentials \
#   --from-literal=password=YourSecurePasswordHere \
#   -n apps \
#   --dry-run=client \
#   -o yaml > postgres-credentials.yaml
#
# 3. Seal the secret:
# kubeseal -f postgres-credentials.yaml -w postgres-credentials-sealed.yaml
#
# 4. Commit the sealed secret to git (safe to commit)
# 5. Flux automatically unseals it when deployed
#
# Replace the example below with your actual sealed secret after running kubeseal

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: apps
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    password: AgA1234567890ABCDEFGHIJ...
  template:
    metadata:
      name: postgres-credentials
      namespace: apps
    type: Opaque
