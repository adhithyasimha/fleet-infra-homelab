apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bitwarden
  template:
    metadata:
      labels:
        app: bitwarden
    spec:
      containers:
        - name: bitwarden
          image: ghcr.io/bitwarden/lite:2026.8.1
          envFrom:
            - configMapRef:
                name: bitwarden-config
          env:
            - name: BW_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: bitwarden-installation
                  key: installation-id
            - name: BW_INSTALLATION_KEY
              valueFrom:
                secretKeyRef:
                  name: bitwarden-installation
                  key: installation-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /etc/bitwarden
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitwarden-data
