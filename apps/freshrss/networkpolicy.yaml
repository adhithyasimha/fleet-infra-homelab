apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freshrss-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: freshrss
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 80
