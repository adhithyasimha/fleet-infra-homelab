# Generate the source secret, then seal it for the cluster:
#
# kubectl create secret generic invidious-secrets \
#   --namespace apps \
#   --from-literal=companion-key="$(openssl rand -hex 8)" \
#   --from-literal=hmac-key="$(openssl rand -hex 32)" \
#   --dry-run=client -o yaml > /tmp/invidious-secrets.yaml
# kubeseal -f /tmp/invidious-secrets.yaml \
#   -w apps/invidious/invidious-secrets-sealed.yaml
#
# Then uncomment invidious-secrets-sealed.yaml in kustomization.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: invidious-secrets
  namespace: apps
spec:
  encryptedData:
    companion-key: REPLACE_WITH_KUBESEAL_OUTPUT
    hmac-key: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: invidious-secrets
      namespace: apps
    type: Opaque
