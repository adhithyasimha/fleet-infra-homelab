apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious-companion
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious-companion
  template:
    metadata:
      labels:
        app: invidious-companion
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: companion
          image: quay.io/invidious/invidious-companion:latest
          env:
            - name: SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: companion-key
          ports:
            - name: http
              containerPort: 8282
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /var/tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: invidious-companion-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious
  template:
    metadata:
      labels:
        app: invidious
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate-database
          image: quay.io/invidious/invidious:latest
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export INVIDIOUS_CONFIG="$(printf 'db:\n  dbname: invidious\n  user: %s\n  password: %s\n  host: invidious-db-rw.apps.svc.cluster.local\n  port: 5432\nhmac_key: %s\n' "$DB_USER" "$DB_PASSWORD" "$HMAC_KEY")"
              exec /invidious/invidious --migrate
          env:
            - name: INVIDIOUS_PORT
              value: "3000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: invidious-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invidious-db-app
                  key: password
            - name: HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: hmac-key
      containers:
        - name: invidious
          image: quay.io/invidious/invidious:latest
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export INVIDIOUS_CONFIG="$(printf 'db:\n  dbname: invidious\n  user: %s\n  password: %s\n  host: invidious-db-rw.apps.svc.cluster.local\n  port: 5432\ncheck_tables: true\ninvidious_companion:\n  - private_url: http://invidious-companion.apps.svc.cluster.local:8282/companion\ninvidious_companion_key: %s\ndomain: youtube.example.com\nexternal_port: 443\nhttps_only: true\nhmac_key: %s\n' "$DB_USER" "$DB_PASSWORD" "$COMPANION_KEY" "$HMAC_KEY")"
              exec /invidious/invidious
          env:
            - name: INVIDIOUS_PORT
              value: "3000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: invidious-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invidious-db-app
                  key: password
            - name: COMPANION_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: companion-key
            - name: HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: hmac-key
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
