apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: apps
data:
  glance.yml: |
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Asia/Kolkata
                    label: India
              - type: calendar
                first-day-of-week: monday
          - size: full
            widgets:
              - type: search
                search-engine: duckduckgo
                autofocus: true
              - type: bookmarks
                groups:
                  - title: Media
                    links:
                      - title: Photos
                        url: https://photos.example.invalid
                      - title: Jellyfin
                        url: https://jellyfin.example.invalid
                      - title: Music
                        url: https://music.example.invalid
                  - title: Services
                    links:
                      - title: Nextcloud
                        url: https://nextcloud.example.invalid
                      - title: FreshRSS
                        url: https://rss.example.invalid
                      - title: Search
                        url: https://search.example.invalid
                      - title: Pi-hole
                        url: https://pihole.example.invalid/admin/
              - type: hacker-news
                limit: 10
                collapse-after: 5
