apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      annotations:
        checksum/config: 54b903c10e5ceac8ac7af09fada1ceca43880013ba05237bdc49e7a43a485e3e
      labels:
        app: glance
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glance
          image: glanceapp/glance:latest
          env:
            - name: GLANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glance-auth
                  key: secret-key
            - name: GLANCE_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: glance-auth
                  key: password-hash
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/config/glance.yml
              subPath: glance.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glance-config
