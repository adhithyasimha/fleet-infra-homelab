apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
  namespace: apps
spec:
  interval: 1h
  chart:
    spec:
      chart: dawarich
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  values:
    health:
      startup:
        enabled: true
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 15
      readiness:
        enabled: true
        failureThreshold: 12
        periodSeconds: 10
        timeoutSeconds: 15
      liveness:
        enabled: true
        failureThreshold: 6
        periodSeconds: 30
        timeoutSeconds: 15
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    worker:
      concurrency: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi
    postgresql:
      enabled: true
      standalone:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
    redis:
      enabled: true
      standalone:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
