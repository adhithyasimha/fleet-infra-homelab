apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: apps
data:
  config.yml: |
    tunnel: 00000000-0000-4000-8000-000000000000
    credentials-file: /etc/cloudflared/creds.json
    ingress:
      - hostname: n8n.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: n8n.example.invalid
        service: http://n8n.apps.svc.cluster.local:5678
      - hostname: rancher.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: rancher.example.invalid
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: photos.example.invalid
        path: ^/(admin|anon-identity|anon-profiles|attachments|authenticator|billing|cast|collection-actions|collections|comments|comments-reactions|contacts|custom-domain|diff|discount|email-hash|emails-from-hashes|emergency-contacts|events|family|file|file-data|file-link|files|fire|info|legacy-kits|listmonk|mail|memory-share|metrics|multipart-upload-url|options|participants|pass-info|passkeys|paste|ping|public-collection|public-memory|push|queue|reactions|remote-store|social|storage-bonus|thumbnail|trash|unknown-api|upload-url|user|user-entity|users|verify-password)(/.*)?$
        service: http://ente-museum.apps.svc.cluster.local:8080
      - hostname: photos.example.invalid
        service: http://ente-web.apps.svc.cluster.local:3000
      - hostname: auth.example.invalid
        service: http://ente-web.apps.svc.cluster.local:3003
      - hostname: ente-storage.example.invalid
        service: http://ente-minio.apps.svc.cluster.local:3200
      - hostname: nextcloud.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: nextcloud.example.invalid
        service: http://nextcloud.apps.svc.cluster.local:8080
      - hostname: backroom.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: backroom.example.invalid
        service: http://nextcloud.apps.svc.cluster.local:8080
      - hostname: lldap.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: lldap.example.invalid
        service: http://lldap.lldap.svc.cluster.local:17170
      - hostname: jellyfin.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: jellyfin.example.invalid
        service: http://jellyfin.apps.svc.cluster.local:8096
      - hostname: vault.example.invalid
        service: http://bitwarden.apps.svc.cluster.local:8080
      - hostname: rss.example.invalid
        service: http://freshrss.apps.svc.cluster.local:80
      - hostname: music.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: music.example.invalid
        service: http://navidrome.apps.svc.cluster.local:4533
      - hostname: downloads.example.invalid
        path: /.well-known/acme-challenge/*
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: downloads.example.invalid
        service: http://qbittorrent.apps.svc.cluster.local:8080
      - hostname: search.example.invalid
        service: http://searxng.apps.svc.cluster.local:8080
      - hostname: home.example.invalid
        service: http://glance.apps.svc.cluster.local:8080
      - hostname: pihole.example.invalid
        service: http://pihole.apps.svc.cluster.local:80
      - hostname: grafana.example.invalid
        service: http://grafana.apps.svc.cluster.local:80
      - hostname: git.example.invalid
        service: http://forgejo-gitea-http.apps.svc.cluster.local:3000
      - hostname: locker.example.invalid
        service: http://ente-web.apps.svc.cluster.local:3009
      - service: http_status:404
