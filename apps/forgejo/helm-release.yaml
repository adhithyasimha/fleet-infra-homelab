apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: apps
spec:
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  values:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    gitea:
      admin:
        username: admin
      config:
        database:
          DB_TYPE: sqlite3
    ingress:
      enabled: false
