# Sealed Secrets for Authentik bootstrap admin and secret key
#
# The secret key signs cookies and must NEVER change after first install.
# The bootstrap admin is created on first boot (default username: akadmin).
#
# 1. Create a regular secret locally:
# kubectl create secret generic authentik-config \
#   --from-literal=AUTHENTIK_SECRET_KEY="$(openssl rand -hex 32)" \
#   --from-literal=AUTHENTIK_BOOTSTRAP_ADMIN_EMAIL="admin@example.com" \
#   --from-literal=AUTHENTIK_BOOTSTRAP_ADMIN_PASSWORD="YourSecurePasswordHere" \
#   -n authentik \
#   --dry-run=client \
#   -o yaml > authentik-config.yaml
#
# 2. Seal the secret:
# kubeseal -f authentik-config.yaml -w authentik-config-sealed.yaml
#
# 3. Commit the sealed secret to git (safe to commit)
# 4. Flux automatically unseals it when deployed
#
# Replace the example below with your actual sealed secret after running kubeseal

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-config
  namespace: authentik
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    AUTHENTIK_SECRET_KEY: AgA1234567890ABCDEFGHIJ...
    AUTHENTIK_BOOTSTRAP_ADMIN_EMAIL: AgA1234567890ABCDEFGHIJ...
    AUTHENTIK_BOOTSTRAP_ADMIN_PASSWORD: AgA1234567890ABCDEFGHIJ...
  template:
    metadata:
      name: authentik-config
      namespace: authentik
    type: Opaque
