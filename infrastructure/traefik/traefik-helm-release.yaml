apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "32.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ports:
      web:
        port: 80
      websecure:
        port: 443
        tls:
          enabled: true
    
    ingressClass:
      enabled: true
      isDefaultClass: true
    
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    
    service:
      type: LoadBalancer
    
    logs:
      general:
        level: INFO
    
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
