name: Publish sanitized showcase

on:
  push:
    branches:
      - main

concurrency:
  group: publish-showcase-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync sanitized showcase
        env:
          SOURCE_TOKEN: ${{ github.token }}
          SHOWCASE_PUSH_TOKEN: ${{ secrets.SHOWCASE_PUSH_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import tempfile
          import uuid
          from pathlib import Path

          source_repo = "adhithyasimha/fleet-infra"
          showcase_repo = "adhithyasimha/fleet-infra-homelab"
          words = (
              "amber", "birch", "cinder", "delta", "ember", "fern", "glacier", "harbor",
              "indigo", "juniper", "kepler", "lumen", "maple", "nectar", "onyx", "prairie",
              "quartz", "ripple", "summit", "timber", "umber", "velvet", "willow", "zenith",
          )

          def git_env(token):
              env = os.environ.copy()
              auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              env["GIT_CONFIG_COUNT"] = "1"
              env["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
              env["GIT_CONFIG_VALUE_0"] = f"AUTHORIZATION: basic {auth}"
              return env

          def run_git(args, cwd, token):
              subprocess.run(
                  ["git", *args],
                  cwd=cwd,
                  env=git_env(token),
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )

          def word_name(seed):
              digest = hashlib.sha256(seed).digest()
              indexes = [int.from_bytes(digest[offset:offset + 2], "big") % len(words) for offset in range(0, 8, 2)]
              return "-".join(words[index] for index in indexes)

          def ignore_showcase_files(directory, names):
              ignored = []
              for name in names:
                  candidate = Path(directory) / name
                  if name == "secrets" or name == "invidious":
                      ignored.append(name)
                  elif candidate.is_file() and candidate.suffix.lower() in {".yaml", ".yml", ".json"}:
                      content = candidate.read_bytes()
                      if (
                          re.search(rb"(?m)^kind:\s*(?:Secret|SealedSecret)\s*$", content)
                          or re.search(rb'"kind"\s*:\s*"(?:Secret|SealedSecret)"', content)
                      ):
                          ignored.append(name)
              return ignored

          source_token = os.environ["SOURCE_TOKEN"]
          showcase_token = os.environ.get("SHOWCASE_PUSH_TOKEN", "")
          if not source_token or not showcase_token:
              raise SystemExit("SOURCE_TOKEN and SHOWCASE_PUSH_TOKEN are required")

          with tempfile.TemporaryDirectory() as temporary:
              work = Path(temporary)
              source = work / "source"
              showcase = work / "showcase"
              run_git(["clone", "--depth", "1", f"https://github.com/{source_repo}.git", str(source)], work, source_token)
              run_git(["clone", "--depth", "1", "--branch", "main", f"https://github.com/{showcase_repo}.git", str(showcase)], work, showcase_token)

              for child in showcase.iterdir():
                  if child.name == ".git":
                      continue
                  shutil.rmtree(child) if child.is_dir() else child.unlink()

              for child in source.iterdir():
                  if child.name in {".git", ".github"}:
                      continue
                  if child.name in ignore_showcase_files(source, [child.name]):
                      continue
                  if child == source / "apps" and child.is_dir():
                      shutil.copytree(child, showcase / child.name, ignore=ignore_showcase_files)
                  elif child.is_dir():
                      shutil.copytree(child, showcase / child.name, ignore=ignore_showcase_files)
                  else:
                      shutil.copy2(child, showcase / child.name)

              shutil.rmtree(showcase / "apps" / "invidious", ignore_errors=True)

              domain_replacement = f"{word_name(b'domain:example.invalid')}.invalid".encode()
              tunnel_replacement = str(
                  uuid.UUID(bytes=hashlib.sha256(b"tunnel:wolfslair").digest()[:16], version=4)
              ).encode()
              password_paths = {
                  Path("infrastructure/postgres-helm-release.yaml"),
                  Path("apps/nextcloud/helm-release.yaml"),
              }
              password_counts = {path: 0 for path in password_paths}
              domain_count = 0
              tunnel_count = 0

              for path in (item for item in showcase.rglob("*") if item.is_file()):
                  content = path.read_bytes()
                  updated = content.replace(b"example.invalid", domain_replacement)
                  domain_count += content.count(b"example.invalid")

                  if path == showcase / "apps/cloudflared/configmap.yaml":
                      updated, count = re.subn(
                          rb"(?m)^(\s*tunnel:\s*)[0-9a-fA-F-]{36}(\s*)$",
                          lambda match: match.group(1) + tunnel_replacement + match.group(2),
                          updated,
                      )
                      tunnel_count += count

                  relative_path = path.relative_to(showcase)
                  if relative_path in password_paths:
                      def redact_password(match):
                          password_counts[relative_path] += 1
                          seed = b"showcase-password:" + str(relative_path).encode()
                          return match.group(1) + word_name(seed).encode()

                      updated = re.sub(rb"(?m)^(\s*password:\s*)([^\s#]+)", redact_password, updated)

                  if updated != content:
                      path.write_bytes(updated)

              if domain_count == 0 or tunnel_count != 1:
                  raise SystemExit("Expected domain or tunnel UUID was not found for redaction")

              for path in (item for item in showcase.rglob("*") if item.is_file()):
                  content = path.read_bytes()
                  if b"example.invalid" in content:
                      raise SystemExit(f"Domain redaction check failed: {path.relative_to(showcase)}")
                  if re.search(rb"(?m)^kind:\s*(?:Secret|SealedSecret)\s*$", content):
                      raise SystemExit(f"Secret manifest was copied: {path.relative_to(showcase)}")
                  if re.search(rb'"kind"\s*:\s*"(?:Secret|SealedSecret)"', content):
                      raise SystemExit(f"Secret manifest was copied: {path.relative_to(showcase)}")
              if b"00000000-0000-4000-8000-000000000000" in (showcase / "apps/cloudflared/configmap.yaml").read_bytes():
                  raise SystemExit("Tunnel UUID redaction check failed")
              if (showcase / "apps" / "invidious").exists():
                  raise SystemExit("Invidious exclusion check failed")

              run_git(["config", "user.name", "github-actions[bot]"], showcase, showcase_token)
              run_git(["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], showcase, showcase_token)
              run_git(["add", "--all"], showcase, showcase_token)
              subprocess.run(["git", "diff", "--cached", "--check"], cwd=showcase, check=True)
              changed = subprocess.run(["git", "diff", "--cached", "--quiet"], cwd=showcase)
              if changed.returncode == 0:
                  print("Showcase is already up to date")
              elif changed.returncode == 1:
                  run_git(["commit", "-m", "Sync sanitized showcase from fleet-infra"], showcase, showcase_token)
                  run_git(["push", "origin", "main"], showcase, showcase_token)
              else:
                  raise SystemExit(changed.returncode)
          PY
