name: Publish sanitized showcase

on:
  push:
    branches:
      - main

concurrency:
  group: publish-showcase-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout public showcase
        uses: actions/checkout@v7
        with:
          repository: adhithyasimha/fleet-infra-homelab
          ref: main
          token: ${{ secrets.SHOWCASE_PUSH_TOKEN }}
          path: showcase

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test Go generator
        working-directory: source
        run: go test ./...

      - name: Copy and redact showcase files
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='apps/invidious/' \
            source/ showcase/
          rm -rf showcase/apps/invidious

          python3 - <<'PY'
          import hashlib
          import re
          import uuid
          from pathlib import Path

          root = Path("showcase")
          words = (
              "amber", "birch", "cinder", "delta", "ember", "fern", "glacier", "harbor",
              "indigo", "juniper", "kepler", "lumen", "maple", "nectar", "onyx", "prairie",
              "quartz", "ripple", "summit", "timber", "umber", "velvet", "willow", "zenith",
          )

          def word_name(seed):
              hashed = hashlib.sha256(seed).digest()
              indices = [int.from_bytes(hashed[offset:offset + 2], "big") % len(words) for offset in range(0, 8, 2)]
              return "-".join(words[index] for index in indices)

          domain_replacement = f"{word_name(b'domain:example.invalid')}.invalid".encode()
          tunnel_replacement = str(uuid.UUID(bytes=hashlib.sha256(b"tunnel:wolfslair").digest()[:16], version=4)).encode()
          password_paths = {
              Path("infrastructure/postgres-helm-release.yaml"),
              Path("apps/nextcloud/helm-release.yaml"),
          }
          password_counts = {path: 0 for path in password_paths}
          domain_count = 0
          tunnel_count = 0

          for path in (item for item in root.rglob("*") if item.is_file()):
              content = path.read_bytes()
              updated = content.replace(b"example.invalid", domain_replacement)
              domain_count += content.count(b"example.invalid")

              if path == root / "apps/cloudflared/configmap.yaml":
                  updated, count = re.subn(
                      rb"(?m)^(\s*tunnel:\s*)[0-9a-fA-F-]{36}(\s*)$",
                      lambda match: match.group(1) + tunnel_replacement + match.group(2),
                      updated,
                  )
                  tunnel_count += count

              relative_path = path.relative_to(root)
              if relative_path in password_paths:
                  def replace_password(match):
                      password_counts[relative_path] += 1
                      seed = str(relative_path).encode() + b":" + match.group(2)
                      return match.group(1) + word_name(seed).encode()

                  updated = re.sub(
                      rb"(?m)^(\s*password:\s*)([^\s#]+)",
                      replace_password,
                      updated,
                  )

              if updated != content:
                  path.write_bytes(updated)

          if domain_count == 0 or tunnel_count != 1 or any(count == 0 for count in password_counts.values()):
              raise SystemExit("Expected domain, tunnel UUID, or password field was not found for redaction")

          for path in (item for item in root.rglob("*") if item.is_file()):
              content = path.read_bytes()
              if b"example.invalid" in content:
                  raise SystemExit(f"Domain redaction check failed for {path}")
          if b"00000000-0000-4000-8000-000000000000" in (root / "apps/cloudflared/configmap.yaml").read_bytes():
              raise SystemExit("Tunnel UUID redaction check failed")
          PY

      - name: Commit and push showcase changes
        working-directory: showcase
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Showcase is already up to date."
            exit 0
          fi
          git commit -m "Sync sanitized showcase from fleet-infra"
          git push origin main
